# addacrm web. Host Caddy owns :443; this process is loopback only.
# NEXT_PUBLIC_* are build-args (baked into the Next client bundle).

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME:-AddaCRM}
        NEXT_PUBLIC_PLAYER_IMPORT_ASYNC_ENABLED: ${NEXT_PUBLIC_PLAYER_IMPORT_ASYNC_ENABLED:-true}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3030:3000"
